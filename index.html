<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BibXMR — Monero Ecosystem Tools</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .logo {
            width: 160px;
            height: 160px;
            margin-bottom: 1rem;
            border-radius: 50%;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            color: #FF6600;
            letter-spacing: 0.05em;
        }

        .tagline {
            margin-top: 0.5rem;
            font-size: 1.1rem;
            color: #999;
        }

        .cards {
            display: flex;
            gap: 1.5rem;
            max-width: 800px;
            width: 100%;
        }

        .card {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid #333;
            border-top: 3px solid #FF6600;
            border-radius: 6px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
        }

        .card h2 {
            font-size: 1.4rem;
            color: #fff;
            margin-bottom: 0.5rem;
        }

        .card p {
            font-size: 0.95rem;
            color: #aaa;
            line-height: 1.5;
            flex: 1;
        }

        .card a {
            display: inline-block;
            margin-top: 1rem;
            color: #FF6600;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .card a:hover {
            text-decoration: underline;
        }

        footer {
            margin-top: 3rem;
            font-size: 0.8rem;
            color: #555;
        }

        footer a {
            color: #FF6600;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2.5rem;
            }

            .cards {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <header>
        <img src="assets/BibXMR.png" alt="BibXMR logo" class="logo">
        <h1>BibXMR</h1>
        <p class="tagline">Open-source tools for the Monero ecosystem</p>
    </header>

    <main class="cards">
        <div class="card">
            <h2>Client</h2>
            <p>A C#/.NET client library for Monero's JSON-RPC API</p>
            <a href="https://github.com/BibXMR/Client" target="_blank">View on GitHub &rarr;</a>
        </div>
        <div class="card">
            <h2>TUI</h2>
            <p>A cross-platform TUI for monitoring, managing, and querying <code>monerod</code></p>
            <a href="https://github.com/BibXMR/TUI" target="_blank">View on GitHub &rarr;</a>
        </div>
    </main>

    <footer>
        <a href="https://github.com/BibXMR" target="_blank">github.com/BibXMR</a>
    </footer>
</body>

</html>
